[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textile-manufacturing"
version = "0.1.0"
description = "Textile Manufacturing Intelligence System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.18.4",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "psycopg2-binary==2.9.10",
    "openpyxl==3.1.5",
    "qrcode==7.4.2",
    "pillow==11.3.0",
    "httpx==0.28.1",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "joblib==1.5.2",
    "PyJWT==2.13.0",
    "passlib==1.7.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "factory_boy==3.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]